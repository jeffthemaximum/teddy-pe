battery_tests:
- position: 1
  name: 20m sprint
  key: sprint_20m
  protocol: Standing start, 2–3 trials, full rest, phone timer. Best.
  area_name: Speed
  unit: s
- position: 2
  name: Standing broad jump
  key: broad_jump
  protocol: 3 trials. Must stick the landing to count. Measure to the back heel.
  area_name: Power & Landing
  unit: cm
- position: 3
  name: Single-leg hop, each leg
  key: single_leg_hop
  protocol: 2 trials each leg. Stick on the same leg. A gap over 15% is a flag.
  area_name: Power & Landing
  unit: cm R / cm L
- position: 4
  name: Overhand throw, each arm
  key: overhand_throw
  protocol: Tennis ball, 3 throws each arm. Best each.
  area_name: Throw & Catch
  unit: m R / m L
- position: 5
  name: Dead hang
  key: dead_hang
  protocol: Best of 2, 2 min rest between.
  area_name: Strength
  unit: s
- position: 6
  name: Line-touch agility
  key: line_touch
  protocol: 5m out, touch, back, touch, out. 2 trials. Best.
  area_name: Speed / Coordination
  unit: s
- position: 7
  name: Jump rope singles
  key: jump_rope
  protocol: Consecutive without a miss. Best of 3.
  area_name: Coordination
  unit: reps
- position: 8
  name: Tennis rally count
  key: rally_count
  protocol: Cooperative rally with Dad, current ball. Best of 3.
  area_name: Tennis
  unit: balls
- position: 9
  name: Basketball cone weave
  key: cone_weave
  protocol: 5 cones 2m apart. Dribble down with the right hand, back with the left,
    ball never above the waist. 2 trials. Best.
  area_name: Basketball
  unit: s
- position: 10
  name: Soccer wall passes
  key: wall_passes
  protocol: 3m from the wall, 30 seconds, alternating feet, inside of the foot. Count
    controlled returns.
  area_name: Soccer
  unit: in 30 s
