---
month_plan:
  month: 2026-09
  block: cub
  label: Cub block · Weeks 1–3
  range_display: Sep 14 – Oct 4
weeks:
- number: 1
  position_in_block: 1
  theme: Baseline & Land
  dates_display: Sep 14–20
  trials: false
  targets:
  - Full test battery recorded, all 10 plus height
  - Athletic stance and stick landing from the ground
  - 'Cartwheel step 1: bunny hops over a line'
  - 'Tennis: split step on Dad''s clap'
  - 'Basketball: 200 stationary dribbles a session, eyes up'
  - 'Soccer: first touch off the wall, both feet; keeper W-catch'
  challenge: Silent Landings. 10 jumps off a step, count the silent ones. Monday number,
    Friday number.
  days:
  - dow: mon
    date: '2026-09-14'
    name: Land Like a Cat
    role: Floor Day
    minutes: 60–75
    intensity: 1
    summary_lines:
    - Stick landings, ground then curb
    - 'Cartwheel step 1: bunny hops ×10 each way'
    - 'Basketball: pound, crossover, figure 8, 200 dribbles'
    - 'Challenge: Silent Landings (Mon)'
    - Champion's Log begins
    dad_note: 'Gym already loaded him. Zero sprinting and zero jumping for distance
      today. The basketball block is volume, not intensity: 200 dribbles is the target,
      and losing the ball is fine, looking down is the thing to correct. Watch the
      knees on landing: if they cave inward, lower the step.'
    hie: 0
    blocks:
    - minutes: '8'
      name: Wake Up
      body: 'Animal walk medley: bear, crab, monkey, flamingo, giraffe, 10m each.
        Then 10 skips.'
      tag:
    - minutes: '12'
      name: New Thing
      body: 'Stick landing from the ground. Jump up, land in <q>cat position</q>:
        feet quiet, knees over toes, chest up, hands out front. Freeze 3 seconds.
        10 reps, Dad scores each 1 to 3 for quiet. Then 10 from a curb or bottom step.'
      tag:
    - minutes: '10'
      name: Cartwheel step 1
      body: Bunny hops over a chalk line. Hands on the line, kick both feet over to
        the other side, land feet together. 10 each direction. <q>Arms straight, look
        at your hands.</q>
      tag:
    - minutes: '20'
      name: 'Basketball: Handle'
      body: Stationary handling, eyes up on Dad's fingers (he holds up numbers, Teddy
        calls them). Pound dribble 25 each hand, crossovers 25, figure 8 through the
        legs 10 each way, then again. About 200 dribbles. Ball below the waist. <q>Eyes
        up, ball low.</q>
      tag:
    - minutes: '7'
      name: Challenge
      body: "<b>Silent Landings.</b> 10 jumps off the step. Count how many make no
        sound. Write the number on the chart. Again Friday."
      tag: challenge
    - minutes: '5'
      name: Champion's Log
      body: 'First entry. One line: best thing today. Teddy writes it himself.'
      tag:
    - minutes: '10'
      name: Play
      body: Skateboard cruise or bike. Nothing timed.
      tag:
  - dow: tue
    date: '2026-09-15'
    name: 'Test Day 1: Hands & Arms'
    role: Rings Day
    minutes: 75–90
    intensity: 2
    summary_lines:
    - 'Tests: dead hang, overhand throw R/L, single-leg balance, height'
    - Riverside rings intro, goal 3 passes
    - 'Soccer: wall touch both feet, 300 touches'
    - HORSE
    dad_note: 'Tests before rings, while he is fresh. Full rest between throws; these
      are max efforts. Cheer the effort, record the number without commentary. The
      non-dominant arm and the left foot will look bad. That is the point: they are
      what will move most this year. Swim class after is recovery, add nothing.'
    hie: 6
    blocks:
    - minutes: '10'
      name: Wake Up
      body: Skips, big and small arm circles, bear crawl 2×10m, inchworms ×5.
      tag:
    - minutes: '3'
      name: 'Test: Height'
      body: Against a wall, shoes off, heels down. Record cm. Repeat at every retest.
      tag: test
    - minutes: '5'
      name: 'Test: Dead hang'
      body: Best of 2, 2 min rest between. Straight arms, thumbs around the bar. Record
        seconds.
      tag: test
    - minutes: '10'
      name: 'Test: Overhand throw'
      body: Tennis ball, from a step. 3 throws right, 3 throws left. Mark the best
        with a cone, pace it. Record both arms.
      tag: test
    - minutes: '5'
      name: Single-leg balance
      body: Each leg, eyes open, arms out, up to 60s. Record each leg (skill unlock,
        not a battery item).
      tag:
    - minutes: '15'
      name: Rings
      body: 'Riverside traveling rings. Hang and swing ×5. Then reach for the next
        ring with Dad spotting the hips. Goal: 3 passes. If he gets 3, try for 5.'
      tag:
    - minutes: '15'
      name: 'Soccer: Touch'
      body: 'At a wall. Pass, receive, pass: 25 with the right foot, 25 with the left.
        Then toe taps 30s, tick-tocks 30s, sole rolls 30s, twice through. About 300
        touches. <q>Soft foot, look up after the touch.</q>'
      tag:
    - minutes: '15'
      name: Play
      body: Basketball court. HORSE, Dad shoots from one spot.
      tag:
  - dow: wed
    date: '2026-09-16'
    name: 'Test Day 2: Fast & Far'
    role: Fast Day
    minutes: 100–120
    intensity: 3
    summary_lines:
    - 'Tests: 20m sprint, broad jump, single-leg hop, line-touch, soccer wall passes'
    - 'New: ready position + split step ×15'
    - 'Soccer: inside-foot passing at 3m, both feet'
    - Roll-out sharks & minnows
    dad_note: 'High-intent efforts today: 3 sprints, 3 jumps, 4 hops, 2 shuttles,
      3 challenge jumps, about 15. That is the week''s load spike, by design. The
      soccer passing is technical volume and does not count. If he is flat on the
      third sprint, take the best of two and move on.'
    hie: 15
    blocks:
    - minutes: '12'
      name: Wake Up
      body: A-march 2×15m, skips 2×15m, gallops each lead 2×15m, high knees 2×10m.
        Then 3 build-up runs over 20m at 60, 70, 80%.
      tag:
    - minutes: '10'
      name: 'Test: 20m sprint'
      body: 'Standing start behind a line, Dad at 20m with the phone timer: <q>ready,
        set, go</q>. 3 trials, walk-back rest of 2 min. Record best.'
      tag: test
    - minutes: '8'
      name: 'Test: Broad jump'
      body: Toes behind the line, arm swing, jump, must stick the landing to count.
        3 trials. Measure to the back heel. Record best.
      tag: test
    - minutes: '8'
      name: 'Test: Single-leg hop'
      body: Each leg, 2 trials, stick the landing on the same leg. Record both.
      tag: test
    - minutes: '8'
      name: 'Test: Line-touch'
      body: Cones at 0 and 5m. Sprint out, touch, back, touch, out. 2 trials. Record
        best.
      tag: test
    - minutes: '12'
      name: New Thing
      body: Ready position and split step. Feet wider than shoulders, knees soft,
        hands ready. Dad claps, Teddy does a tiny hop-and-land, then points where
        Dad points. 15 reps. <q>Land ready.</q>
      tag:
    - minutes: '12'
      name: 'Soccer: Pass'
      body: 'Inside-foot passing to a cone gate at 3m, 20 each foot. Then <b>Test:
        soccer wall passes</b>, 30 seconds alternating feet, count controlled returns.
        Record.'
      tag: test
    - minutes: '8'
      name: Strong
      body: Bear walk 2×15m, crab walk 2×10m, 2 dead hangs.
      tag:
    - minutes: '8'
      name: Challenge
      body: "<b>Beat Dad's Broad Jump.</b> Dad jumps from kneeling. Teddy tries to
        beat the mark from standing. Best of 3."
      tag: challenge
    - minutes: '25'
      name: Play
      body: 'Soccer field. Roll-out sharks and minnows: Dad is the stationary shark,
        rolling balls to tag. Then free kicking at a goal.'
      tag:
    - minutes: '5'
      name: Shake Out
      body: Walk a lap, calves on the wall, Champion's Log line.
      tag:
  - dow: thu
    date: '2026-09-17'
    name: Wall & Ball
    role: Wall Day
    minutes: 115–125
    intensity: 2
    summary_lines:
    - 'Test: jump rope singles, best of 3'
    - 'Cartwheel step 2: hand-hand-foot-foot'
    - Step-and-throw at wall target 15 R / 10 L
    - 'Tennis: drop-feed FH/BH ×20, rally count test'
    - 'Basketball: jump stop + pivot, chest pass target, cone weave test'
    dad_note: 'Rope first, while he is fresh: give him a practice minute to find
      the rhythm before the three counted tries. Form over volume on the tennis,
      and if the finish starts dropping, stop the set at 10, not 20. The basketball
      cone weave will be slow with the left hand; record it without comment.
      High-intent efforts stay near zero today.'
    hie: 2
    blocks:
    - minutes: '10'
      name: Wake Up
      body: Animal medley, skips, then 10 shadow forehands and 10 shadow backhands
        with a full unit turn.
      tag:
    - minutes: '8'
      name: 'Test: Jump rope'
      body: Consecutive singles without a miss. Best of 3. Record.
      tag: test
    - minutes: '15'
      name: New Thing
      body: 'Cartwheel step 2: <q>hand, hand, foot, foot</q>. Chalk a line. Lunge,
        reach hand then hand onto the line, kick one foot over then the other, land
        on the line. 8 each side. Then 10 donkey kicks against the wall.'
      tag:
    - minutes: '10'
      name: Throw
      body: Step-and-throw at a big chalk square on the tennis wall. Opposite foot
        steps forward. 15 throws dominant, 10 non-dominant. Score the hits.
      tag:
    - minutes: '30'
      name: Tennis
      body: 'Drop-feed forehands ×20: unit turn, contact in front, finish over the
        shoulder. Drop-feed backhands ×20. Wall rally: how many in a row? Then <b>Test:
        rally count</b> with Dad, cooperative, green ball, best of 3. Record. Introduce
        the between-point reset: breathe, bounce, look at the strings.'
      tag: test
    - minutes: '20'
      name: 'Basketball: Footwork & Pass'
      body: 'Jump stop from a jog, then pivot on each foot, 5 each. Triple-threat
        stance. Chest passes to a chalk square at 3m ×15, bounce passes ×15. Then
        <b>Test: cone weave</b>, 5 cones 2m apart, right hand down, left hand back.
        2 trials. Record.'
      tag: test
    - minutes: '6'
      name: Strong
      body: 2 dead hangs, hollow hold 2×15s.
      tag:
    - minutes: '6'
      name: Challenge
      body: "<b>Wall Rally Streak.</b> Longest unbroken streak against the wall. Record."
      tag: challenge
    - minutes: '15'
      name: Play
      body: Basketball. Dribble tag with Dad stationary and a ball to roll, then HORSE.
      tag:
    - minutes: '5'
      name: Shake Out
      body: Champion's Log line.
      tag:
  - dow: fri
    date: '2026-09-18'
    name: Skate & Stick
    role: Skate Day
    minutes: 100–120
    intensity: 1
    summary_lines:
    - Skate park 30 + safe-fall lesson
    - Single-leg stick ×5 each
    - 'Keeper: ready position, W-catch and scoop from hand feeds'
    - Jump rope 2×2 min
    - 'Challenge: Silent Landings (Fri)'
    dad_note: Saturday is roughly 5 hours of organized sport. Today is balance and
      skill, high-intent efforts 5 or fewer. Keeper work is catching only this block;
      diving starts from kneeling in the Fox block once the safe-fall habit is in.
      Early bed, big dinner, water bottle ready for tomorrow.
    hie: 5
    blocks:
    - minutes: '10'
      name: Wake Up
      body: Animal medley, skips, arm circles.
      tag:
    - minutes: '30'
      name: Skate park
      body: 'Free skate. One 5-minute safe-fall lesson: bend the knees, roll onto
        the side and forearm, never straight arms. Practice from kneeling on grass
        ×5.'
      tag:
    - minutes: '12'
      name: New Thing
      body: Single-leg stick. Small hop forward, land on one leg, statue for 3 seconds.
        5 each leg. Then hop sideways ×5 each.
      tag:
    - minutes: '15'
      name: 'Soccer: Keeper'
      body: 'On grass. Ready position: knees bent, hands in front, weight forward.
        Dad hand-feeds 20 balls at chest height for the W-catch (thumbs together behind
        the ball), then 20 rolling balls for the scoop. No diving yet. <q>Hands first,
        then hug it.</q>'
      tag:
    - minutes: '8'
      name: Coordination
      body: Jump rope, 2 rounds of 2 minutes. <q>Tiny hops, wrists not arms.</q>
      tag:
    - minutes: '7'
      name: Challenge
      body: "<b>Silent Landings, round 2.</b> 10 jumps off Monday's step. Beat Monday's
        number."
      tag: challenge
    - minutes: '25'
      name: Play
      body: Soccer field kickaround and passing games. No sprint races today.
      tag:
    - minutes: '5'
      name: Shake Out
      body: 'Calves, hamstrings. Champion''s Log: <q>what was your best thing this
        week?</q>'
      tag:
  - dow: sat
    date: '2026-09-19'
    name: Soccer · Lacrosse · Tennis
    role: Game Day
    minutes: 'off'
    intensity: 4
    summary_lines:
    - Home program off
    - Evening 5-min shake-out
    dad_note: Highest-load day of the week. Watch for heel or knee complaints Sunday
      morning. If there are any, Sunday's card becomes stretching only and you tell
      me.
    hie: 0
    blocks:
    - minutes: "—"
      name: Home program
      body: Off. Add nothing.
      tag:
    - minutes: '5'
      name: Evening shake-out
      body: 'Walk, calves against the wall, 3 slow breaths. Champion''s Log line:
        one thing from each sport.'
      tag:
  - dow: sun
    date: '2026-09-20'
    name: Ceremony
    role: Court Day
    minutes: 30–40
    intensity: 1
    summary_lines:
    - Bunny hops ×10
    - Basketball handling 15 min
    - Read every test number to Teddy
    - 'Draw the Cub card: 9 empty patch slots'
    dad_note: This is the ceremony moment. The numbers are his, the card is his. Next
      week's theme is Stick It.
    hie: 0
    blocks:
    - minutes: '5'
      name: Before tennis
      body: 'Skips, 10 shadow forehands, 10 shadow backhands. Remind him of the reset:
        breathe, bounce, strings.'
      tag:
    - minutes: '8'
      name: After tennis
      body: 'Cartwheel step 1 again: bunny hops over a line ×10. Compare with Monday.'
      tag:
    - minutes: '15'
      name: 'Basketball: Handle'
      body: Stationary handling, 200 dribbles, eyes on Dad's fingers. Finish with
        10 chest passes to a target.
      tag:
    - minutes: '10'
      name: Review
      body: Sit down with the test sheet. Read every number to Teddy, height included.
        Draw the Cub rank card with nine empty patch slots. Ask him which patch he
        wants first.
      tag:
