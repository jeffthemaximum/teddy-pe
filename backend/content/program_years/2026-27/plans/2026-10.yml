  days:
  - dow: mon
    date: '2026-10-05'
    name: Feet in the Sky
    role: Floor Day
    minutes: 60–90
    intensity: 1
    summary_lines:
    - 'Challenge: Hang Time (Mon)'
    - 'Cartwheel step 4: straighter legs ×10 each side'
    - Donkey kicks, then wall handstand holds
    - 'Basketball: figure 8 eyes up, crossovers, 200 dribbles'
    - 'Basketball: handles with no dribble, floor drills and pass through'
    dad_note: 'Hang Time goes first, before anything else has tired his grip: two
      hangs, full rest between, best one counts and goes on the chart. Gymnastics
      has already loaded him, so the upside down work is short and the handstand
      walks down the moment his back arches or his elbows bend. On the cartwheel,
      score the legs only, 1 to 3 for straight. If height is still empty on the
      Tests tab, measure him today, shoes off against a wall.'
    hie: 0
    blocks:
    - minutes: '8'
      name: Wake Up
      body: Animal medley, skips, arm circles. Then wrist circles both ways and 10
        palm presses into the floor, because hands carry him today.
      tag:
    - minutes: '6'
      name: Challenge
      body: '<b>Hang Time.</b> Dead hang from the bar, arms straight, chin level.
        Two tries with a full rest between, and the best one is Monday''s number.
        Again Friday.'
      tag: challenge
    - minutes: '15'
      name: New Thing
      body: 'Cartwheel step 4: straighter legs. Same lunge entry as last week, and
        this time the legs stay long as they pass over the top. 10 each side, Dad
        scores each one 1 to 3 for straight legs. <q>Scissors in the sky.</q>'
      tag:
    - minutes: '10'
      name: Upside Down
      body: Donkey kicks ×10, a little higher each time. Then wall handstand, 3 holds,
        counting out loud. Target is 5 seconds. Walk the feet down if the back starts
        to bend. <q>Straight as a pencil.</q>
      tag:
    - minutes: '20'
      name: 'Basketball: Handle'
      body: Figure 8 through the legs, 10 each way, eyes on Dad's fingers the whole
        time (he holds up numbers, Teddy calls them). Then crossovers ×20 eyes up,
        pound dribble 25 each hand. About 200 dribbles.
      tag:
    - minutes: '10'
      name: 'Basketball: Handles, no dribble'
      body: 'Touch roll, 30 steady and 10 fast. Figure 8 roll, 5 times round. Ball
        glide roll, 10m out and 10m back. Then pass through, 2 × 10m. <q>Fingertips,
        not palms.</q>'
      tag:
    - minutes: '4'
      name: Champion's Log
      body: 'One line: what does the world look like upside down?'
      tag:
    - minutes: '10'
      name: Play
      body: Skateboard cruise or bike. Nothing timed.
      tag:
  - dow: tue
    date: '2026-10-06'
    name: Upside Down on the Rings
    role: Rings Day
    minutes: 75–90
    intensity: 2
    summary_lines:
    - Rings passes, 5 out and back
    - Rings inversion with spot
    - Hanging knee tucks, hollow hold, bear + crab walks
    - 'Soccer: receive and return, then sole rolls and pull-backs'
    - Single-leg balance 30s each
    dad_note: 'The inversion is new and you spot every rep: one hand on his back,
      one on his hips, and he lowers out of it as slowly as he went up. He tucks
      into a ball and turns over, and that is the whole skill for now; he does not
      push through to hang behind the bar. The rings passes are the only maximal
      efforts, about 6. In the soccer block, the pull-back is a drag with the sole,
      so stop him if he starts poking it backward with his toe.'
    hie: 6
    blocks:
    - minutes: '10'
      name: Wake Up
      body: Skips, arm circles, inchworms ×5, wrist circles.
      tag:
    - minutes: '20'
      name: Rings
      body: 'Riverside traveling rings. 5 passes out, turn, and come back. Dad spots
        the hips and never pulls. Then the rings inversion on a ring or bar he can
        reach from the ground: tuck the knees to the chest, lift the hips over the
        head until he is upside down in a ball, hold 2 seconds, come back down the
        same way. 3 to 5 reps. <q>Tuck, turn, look at your toes.</q>'
      tag:
    - minutes: '12'
      name: Strong
      body: Hanging knee tucks ×8, hollow hold 2×20s. Bear walk 2×15m, crab walk 2×10m.
      tag:
    - minutes: '20'
      name: 'Soccer: Touch'
      body: 'Receive and return first, Dad kneeling 3m away and feeding along the
        ground. 10 leading with each foot at the level that foot is on. Then sole
        rolls across the body, 20 each foot. Pull-back and go, 10 each foot: step
        on it, drag it back, turn and take it the other way. Toe taps 50 and tick-tocks
        50 to finish. About 300 touches. <q>Step on it and drag it home.</q>'
      tag:
    - minutes: '6'
      name: Balance
      body: Single-leg balance 30s each leg, then eyes closed for as long as it holds.
        Record both legs.
      tag:
    - minutes: '8'
      name: Play
      body: Wall ball or HORSE, his pick.
      tag:
    - minutes: '4'
      name: Shake Out
      body: Champion's Log line.
      tag:
  - dow: wed
    date: '2026-10-07'
    name: Fast Feet, Upside Down
    role: Fast Day
    minutes: 100–120
    intensity: 3
    summary_lines:
    - Build-ups
    - Cartwheel step 4, wall handstand
    - Clap starts 6×10m, stop in 3 steps
    - Box sticks, single-leg hop and stick, broad jump ×3
    - 'Soccer: pull-back at speed; receive and return with firm feeds'
    - Soccer game
    dad_note: 'High-intent efforts: 6 clap starts over 10m, 6 single-leg hops, 3 broad
      jumps and about 7 bursts in the soccer game, so 22. Full rest between starts,
      and you stay at the cone, so you clap and he comes to you. Every landing is
      a stick; one that wobbles is repeated, and two in a row means the jumping
      is over for today. The cartwheel and handstand go before the speed work so
      they get his best attention.'
    hie: 22
    blocks:
    - minutes: '14'
      name: Wake Up
      body: A-march, skips, gallops each lead, high knees. Then 3 build-up runs over
        20m at 60, 70, 80%.
      tag:
    - minutes: '12'
      name: New Thing
      body: Cartwheel step 4, 8 each side, legs long over the top. Then wall handstand,
        2 holds.
      tag:
    - minutes: '14'
      name: Fast
      body: 'Reaction starts, 6 × 10m. Athletic stance at the line, go on Dad''s clap,
        and stop in 3 quiet steps at his cone. Walk back slowly between each one.
        <q>Clap, go, freeze.</q>'
      tag:
    - minutes: '10'
      name: Power
      body: Stick landing off the 30cm box ×6, stepping off rather than jumping.
        Single-leg hop and stick, 3 each leg, statue for 3 seconds. Broad jump ×3, sticking every landing.
      tag:
    - minutes: '10'
      name: Tennis footwork
      body: Split step into a shuffle. Dad claps, Teddy hops and lands ready, shuffles
        to where Dad points, then recovers to the middle. 10 of 10.
      tag:
    - minutes: '18'
      name: 'Soccer: Touch at speed'
      body: Dribble at speed through cone gates. On Dad's <q>back</q>, pull-back and
        go the other way. 10 calls on each foot. Then receive and return at the highest
        level he owns, 10 each foot, with Dad feeding firmer.
      tag:
    - minutes: '25'
      name: Play
      body: Soccer game with Dad in goal, or free kicking at a goal.
      tag:
    - minutes: '5'
      name: Shake Out
      body: Walk a lap, calves on the wall. Champion's Log line.
      tag:
