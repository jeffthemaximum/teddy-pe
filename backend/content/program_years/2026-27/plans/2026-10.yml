      tag:
    - minutes: '32'
      name: Tennis
      body: 'Drop feed forehands in sets of 10, every one with a finish over the
        shoulder that stays there for a beat. A set counts only if all 10 do. Then backhands
        ×20, unit turn first. Then rally with Dad, green ball, target 20 in a row.
        Reset between points. <q>Catch the racket over your shoulder.</q>'
      tag:
    - minutes: '20'
      name: 'Basketball: Handle & Pass'
      body: Figure 8 through the legs, 10 each way, eyes up, and compare with Monday.
        Jump stop off a jog, then pivot, 5 on each foot. Chest pass to the 3m target
        ×10, bounce pass ×10.
      tag:
    - minutes: '5'
      name: 'Basketball: Handles, no dribble'
      body: 'Pass through, 2 × 10m. Then the drop-and-catch pair, walking: spider
        move, 10 catches, and clap tap, 10 catches. Count the catches and compare
        with last Sunday. <q>Drop, step, snatch.</q>'
      tag:
    - minutes: '6'
      name: Strong
      body: Hollow hold 2×20s, bear walk 2×15m.
      tag:
    - minutes: '14'
      name: Play
      body: Basketball. HORSE and dribble tag with Dad stationary.
      tag:
    - minutes: '5'
      name: Shake Out
      body: Champion's Log line.
      tag:
