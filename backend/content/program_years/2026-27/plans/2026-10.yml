  - dow: tue
    date: '2026-10-06'
    name: Upside Down on the Rings
    role: Rings Day
    minutes: 75–90
    intensity: 2
    summary_lines:
    - Rings passes, 5 out and back
    - Rings inversion with spot
    - Hanging knee tucks, hollow hold, bear + crab walks
    - 'Soccer: receive and return, then sole rolls and pull-backs'
    - Single-leg balance 30s each
    dad_note: 'The inversion is new and you spot every rep: one hand on his back,
      one on his hips, and he lowers out of it as slowly as he went up. He tucks
      into a ball and turns over, and that is the whole skill for now; he does not
      push through to hang behind the bar. The rings passes are the only maximal
      efforts, about 6. In the soccer block, the pull-back is a drag with the sole,
      so stop him if he starts poking it backward with his toe.'
    hie: 6
    blocks:
    - minutes: '10'
      name: Wake Up
      body: Skips, arm circles, inchworms ×5, wrist circles.
      tag:
    - minutes: '20'
      name: Rings
      body: 'Riverside traveling rings. 5 passes out, turn, and come back. Dad spots
        the hips and never pulls. Then the rings inversion on a ring or bar he can
        reach from the ground: tuck the knees to the chest, lift the hips over the
        head until he is upside down in a ball, hold 2 seconds, come back down the
        same way. 3 to 5 reps. <q>Tuck, turn, look at your toes.</q>'
      tag:
    - minutes: '12'
      name: Strong
      body: Hanging knee tucks ×8, hollow hold 2×20s. Bear walk 2×15m, crab walk 2×10m.
      tag:
    - minutes: '20'
      name: 'Soccer: Touch'
      body: 'Receive and return first, Dad kneeling 3m away and feeding along the
        ground. 10 leading with each foot at the level that foot is on. Then sole
        rolls across the body, 20 each foot. Pull-back and go, 10 each foot: step
        on it, drag it back, turn and take it the other way. Toe taps 50 and tick-tocks
        50 to finish. About 300 touches. <q>Step on it and drag it home.</q>'
      tag:
    - minutes: '6'
      name: Balance
      body: Single-leg balance 30s each leg, then eyes closed for as long as it holds.
        Record both legs.
      tag:
    - minutes: '8'
      name: Play
      body: Wall ball or HORSE, his pick.
      tag:
    - minutes: '4'
      name: Shake Out
      body: Champion's Log line.
      tag:
