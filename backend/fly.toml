# One app. No staging: correctness comes from the test suite, not from a
# second paid environment.
app = "teddy-pe-api"
primary_region = "ewr"

[build]

# Runs in a throwaway machine before the new version serves traffic, so the
# schema is in place before the first request and before the health check,
# which asks the database a question and fails the deploy if it cannot answer.
# That last part only became true once the database check was registered under
# the name "default": /healthz is the OkComputer engine root, and the root runs
# the check called "default" and no other. See config/initializers/okcomputer.rb.
# content:seed is idempotent and keyed on natural keys, so running it on every
# deploy is how a content change reaches production: edit the YAML, deploy.
[deploy]
  release_command = "bin/rails db:prepare content:seed"

[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_MAX_THREADS = "3"
  # Single mode, not cluster mode with one worker. Puma says so itself in the
  # boot log, and on a 512MB machine a master process plus one worker is paying
  # twice for one worker's work.
  WEB_CONCURRENCY = "0"

[http_service]
  internal_port = 3000
  force_https = true
  # Sleeps when nobody is using it, wakes on the next request. A site opened a
  # few times a day costs close to nothing this way. The clients are built for
  # the wake-up: a real loading state on first paint and a 15 second timeout.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0


[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # 256MB thrashes or OOMs on a Rails boot. 512 plus swap is the floor that
  # boots reliably.
  memory = "512mb"

[experimental]
  swap_size_mb = 512
